// ReClaw for Android: SDL2 activity + the engine as libmain.so.
//   platform/android/fetch-deps.sh      (SDL2 sources and its Java glue)
//   cd platform/android && ./gradlew assembleRelease
// CLAW.REZ from your copy of the game goes to
// Android/data/org.reclaw.game/files/CLAW.REZ (USB or a file manager).

plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openclaw.claw'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.reclaw.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs as is; use your
            // own key for anything you distribute.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    lint {
        abortOnError false
    }
}

// The files that ship with the port (no game data) go into the APK's assets;
// the game copies them out on its first start (Engine/Platform/Platform.cpp).
def stageBundle = tasks.register('stageBundle', Exec) {
    def assets = "$projectDir/src/main/assets"
    commandLine 'bash', "$rootDir/../../scripts/stage_bundle.sh", assets, "$rootDir/config.xml"
}
preBuild.dependsOn stageBundle
