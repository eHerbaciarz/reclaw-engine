name: Native builds (Switch + Linux)

on:
  push:
    branches-ignore:
      - claw-ps2         # (PS2 quick tests: only ports.yml's PS2 job)
      - claw-dreamcast   # (Dreamcast quick tests: only ports.yml's Dreamcast job)
    paths:
      - 'OpenClaw/**'
      - 'libwap/**'
      - 'Box2D/**'
      - 'ThirdParty/**'
      - 'Build_Release/ASSETS/**'
      - 'Build_Release/music/**'
      - 'platform/**'
      - '.github/workflows/switch.yml'
  pull_request:
  workflow_dispatch:

jobs:
  switch:
    name: Nintendo Switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write   # the "test-switch" release (claw-switch)
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        run: |
          # (pkg.devkitpro.org sometimes answers 403: three tries)
          for i in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed \
              switch-sdl2 switch-sdl2_mixer switch-sdl2_image \
              switch-sdl2_ttf switch-sdl2_gfx switch-zlib && break
            sleep 30
          done
          (apt-get update && apt-get install -y --no-install-recommends zip) || true

      - name: Build
        run: make -C platform/switch -j"$(nproc)"

      - name: Package
        run: |
          scripts/make_reclaw_tree.sh dist/switch/reclaw
          cp platform/switch/reclaw.nro dist/switch/reclaw/

      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-switch
          path: dist/

      # Test builds: every push to claw-switch replaces the files of the
      # "test-switch" pre-release (test_switch.ps1 downloads them)
      - name: Test release files
        if: github.ref == 'refs/heads/claw-switch' && github.event_name != 'pull_request'
        run: |
          cp platform/switch/reclaw.nro dist/reclaw.nro
          (cd dist && zip -qr reclaw-switch.zip switch)
          printf '%s\n' "${GITHUB_SHA}" > dist/commit.txt
      - name: Test release
        if: github.ref == 'refs/heads/claw-switch' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-switch
          name: "Test build (Switch) - claw-switch"
          prerelease: true
          make_latest: false
          body: |
            Automatic test build of claw-switch, commit ${{ github.sha }}.
            Not a release: for testing only (scripts/windows/testing/test_switch.ps1).
          files: |
            dist/reclaw.nro
            dist/reclaw-switch.zip
            dist/commit.txt

  linux:
    name: Linux (native SDL2)
    if: github.ref != 'refs/heads/claw-switch'   # (claw-switch: only the Switch build, fast)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libsdl2-gfx-dev zlib1g-dev

      - name: Build
        run: |
          cmake -S platform/linux -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j"$(nproc)"
