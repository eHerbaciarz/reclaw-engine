name: ReClaw ports (Linux, macOS, Windows, Vita, 3DS, Wii U, PS3, PS4, PS2, Dreamcast, Android)

# Every package contains the engine and the port's own files only. No game
# data: players copy CLAW.REZ from their own copy of Claw (1997).

on:
  push:
    paths:
      - 'OpenClaw/**'
      - 'libwap/**'
      - 'Box2D/**'
      - 'ThirdParty/**'
      - 'Build_Release/ASSETS/**'
      - 'Build_Release/music/**'
      - 'platform/**'
      - 'scripts/stage_bundle.sh'
      - '.github/workflows/ports.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-22.04          # older glibc: the package runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libsdl2-gfx-dev zlib1g-dev zip
      - name: Build
        run: |
          cmake -S platform/linux -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j"$(nproc)"
      - name: Package
        run: platform/linux/package.sh build-linux dist
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-linux-x86_64
          path: dist/reclaw-linux-x86_64.tar.gz

  macos:
    name: macOS (Apple Silicon)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl2_gfx pkg-config dylibbundler
      - name: Build
        run: |
          # SDL2_mixer -> fluidsynth -> readline (keg-only in Homebrew)
          export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --cflags sdl2 SDL2_mixer || true
          echo '#include <SDL2/SDL_thread.h>' | c++ -x c++ -E -H $(pkg-config --cflags sdl2) -I"$(pkg-config --variable=includedir sdl2)" - 2>&1 >/dev/null | head -5 || true
          grep -n "CreateThreadWithStackSize" "$(pkg-config --variable=includedir sdl2)/SDL2/SDL_thread.h" | head -5 || true
          cmake -S platform/linux -B build-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build-macos -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: platform/macos/package.sh build-macos dist
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-macos
          path: dist/reclaw-macos-*.zip

  ps2:
    name: PlayStation 2 (.elf, experimental)
    permissions:
      contents: write   # the "test-ps2" release (claw-ps2)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Host packages
        run: apk add --no-cache bash git cmake make zip python3 curl tar patch
      - uses: actions/checkout@v4
      - name: Sources of SDL2 and its add-ons
        run: bash platform/deps/fetch.sh
      - name: Build
        run: |
          echo "PS2DEV=$PS2DEV PS2SDK=$PS2SDK"
          TC=$(find "$PS2SDK" "$PS2DEV" -name ps2dev.cmake 2>/dev/null | head -1)
          echo "toolchain: $TC"
          cmake -S platform/ps2 -B build-ps2 -DCMAKE_TOOLCHAIN_FILE="$TC" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-ps2 -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p dist
          cp build-ps2/reclaw.elf build-ps2/reclaw/
          mkdir -p build-ps2/reclaw/data/en build-ps2/reclaw/data/pl
          cp platform/ps2/README.txt build-ps2/
          (cd build-ps2 && zip -qr ../dist/reclaw-ps2.zip reclaw README.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-ps2
          path: dist/

      # Quick PS2 tests: every push to claw-ps2 replaces the files of the
      # "test-ps2" pre-release (scripts/test_ps2.ps1 runs it in PCSX2)
      - name: Test release files
        if: github.ref == 'refs/heads/claw-ps2'
        run: printf '%s\n' "${GITHUB_SHA}" > dist/commit.txt
      - name: Test release
        if: github.ref == 'refs/heads/claw-ps2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-ps2
          name: "Test build (PS2) - claw-ps2"
          prerelease: true
          make_latest: false
          body: |
            Automatic test build of claw-ps2, commit ${{ github.sha }}.
            Not a release: for testing only (scripts/test_ps2.ps1).
          files: |
            dist/reclaw-ps2.zip
            dist/commit.txt

  dreamcast:
    name: Dreamcast (.elf, experimental)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    container: kazade/dreamcast-sdk:latest
    steps:
      - name: Host packages
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y --no-install-recommends git cmake make zip python3 ca-certificates; \
          elif command -v apk >/dev/null; then apk add --no-cache bash git cmake make zip python3; \
          elif command -v dnf >/dev/null; then dnf install -y git cmake make zip python3 libpng-devel libjpeg-turbo-devel; fi
          cmake --version
      - uses: actions/checkout@v4
      - name: Sources of SDL2 (Dreamcast port) and its add-ons
        run: |
          bash platform/deps/fetch.sh
          git clone --depth 1 -b dreamcastSDL2 https://github.com/GPF/SDL2 /tmp/sdl2-dc
      - name: Build
        shell: bash
        run: |
          ENV=$(find / -path /proc -prune -o -name environ.sh -path "*kos*" -print 2>/dev/null | head -1)
          echo "KOS environ: $ENV"; source "$ENV"
          echo "KOS_BASE=$KOS_BASE KOS_PORTS=$KOS_PORTS"
          ls "$KOS_BASE/utils/cmake" || true
          ls "$KOS_BASE/../kos-ports" "$KOS_BASE/addons/lib/dreamcast" 2>/dev/null | head -50 || true
          if [ ! -f "$KOS_BASE/addons/lib/dreamcast/libz.a" ] && [ -d "${KOS_PORTS:-$KOS_BASE/../kos-ports}/zlib" ]; then
            make -C "${KOS_PORTS:-$KOS_BASE/../kos-ports}/zlib" install || true
          fi
          # Current KallistiOS (the image's is too old for SDL's PVR renderer):
          # the library is rebuilt from master with the image's compiler
          mkdir -p /tmp/kos-env && cp "$KOS_BASE"/environ*.sh /tmp/kos-env/ && ls /tmp/kos-env
          rm -rf /tmp/kos-new && git clone -q --depth 1 https://github.com/KallistiOS/KallistiOS /tmp/kos-new
          git -C /tmp/kos-new log -1 --format="KallistiOS %h %ad"
          ls /tmp/kos-new/environ* /tmp/kos-new/doc/environ* 2>/dev/null || true
          rm -rf "$KOS_BASE" && mv /tmp/kos-new "$KOS_BASE" && cp /tmp/kos-env/environ*.sh "$KOS_BASE/"
          source "$ENV"
          # (the host tools need image libraries the SDK image lacks: only the
          # ones the build uses; the library itself: kernel + addons)
          for u in scramble genromfs bin2o; do make -C "$KOS_BASE/utils/$u" >/dev/null 2>&1 || echo "utils/$u not built"; done
          if ! { make -C "$KOS_BASE/kernel" -j"$(nproc)" && make -C "$KOS_BASE/addons" -j"$(nproc)"; } > /tmp/kos-build.log 2>&1; then
            grep -nE "error|Error" /tmp/kos-build.log | head -40; tail -30 /tmp/kos-build.log; exit 1
          fi
          source "$ENV"
          make -C "$KOS_PORTS/libGL" uninstall >/dev/null 2>&1 || true
          # GPF's SDL2 compiles its OpenGL glue (GLdc headers) even without OpenGL
          if ! find "$KOS_PORTS" "$KOS_BASE/addons" -path "*GL/glkos.h" 2>/dev/null | grep -q .; then
            make -C "$KOS_PORTS/libGL" install || true
          fi
          find "$KOS_PORTS" "$KOS_BASE/addons" -path "*GL/glkos.h" 2>/dev/null | head -3
          TC="$KOS_BASE/utils/cmake/kallistios.toolchain.cmake"
          cmake -S platform/dreamcast -B build-dc -DCMAKE_TOOLCHAIN_FILE="$TC" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=/tmp/dc-install -DRECLAW_DC_SDL=/tmp/sdl2-dc
          cmake --build build-dc -j"$(nproc)"
      - name: Package
        shell: bash
        run: |
          ENV=$(find / -path /proc -prune -o -name environ.sh -path "*kos*" -print 2>/dev/null | head -1); source "$ENV"
          mkdir -p dist/reclaw-dreamcast
          cp build-dc/reclaw.elf dist/reclaw-dreamcast/
          cp -r build-dc/disc dist/reclaw-dreamcast/disc
          # no 8 MB soundfont in 16 MB of RAM (music is off in config.xml)
          rm -rf dist/reclaw-dreamcast/disc/music
          cp platform/dreamcast/README.txt dist/reclaw-dreamcast/
          # GD-ROM (.gdi made by reclaw_disc.py): the program unscrambled, and
          # the bootstrap (IP.BIN) made by KallistiOS's makeip
          ${KOS_OBJCOPY:-sh-elf-objcopy} -R .stack -O binary build-dc/reclaw.elf dist/reclaw-dreamcast/disc/1ST_READ.BIN
          make -C "$KOS_BASE/utils/makeip" >/dev/null
          MAKEIP=$(find "$KOS_BASE/utils" -maxdepth 2 -type f -name makeip -perm -u+x | head -1)
          "$MAKEIP" -g "RECLAW" -c "HERBACIARZ" -i "GD-ROM1/1" -f dist/reclaw-dreamcast/IP.BIN
          ls -la dist/reclaw-dreamcast/IP.BIN
          cp platform/dreamcast/reclaw_disc.py dist/reclaw-dreamcast/
          ${KOS_STRIP:-sh-elf-strip} dist/reclaw-dreamcast/reclaw.elf || true
          ${KOS_SIZE:-sh-elf-size} dist/reclaw-dreamcast/reclaw.elf || true
          ls -la dist/reclaw-dreamcast dist/reclaw-dreamcast/disc
          command -v mkdcdisc || ls /opt/toolchains/dc/bin 2>/dev/null || true
          (cd dist && zip -qr reclaw-dreamcast.zip reclaw-dreamcast)
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-dreamcast
          path: dist/reclaw-dreamcast.zip

  windows:
    name: Windows x86_64
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            zip
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_ttf mingw-w64-x86_64-SDL2_gfx mingw-w64-x86_64-zlib
      - name: Build
        run: |
          cmake -S platform/linux -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DMINGW_PREFIX=/mingw64
          cmake --build build-win
      - name: Package
        run: |
          PKG=dist/reclaw-windows-x86_64
          mkdir -p "$PKG"
          scripts/stage_bundle.sh "$PKG"
          scripts/make_reclaw_tree.sh "$PKG"
          cp build-win/openclaw.exe "$PKG/ReClaw.exe"
          strip "$PKG/ReClaw.exe"
          # every DLL the game needs, except Windows' own
          ntldd -R "$PKG/ReClaw.exe" | grep -i mingw64 | awk '{print $3}' | tr '\\' '/' | \
            while read -r dll; do cp "$(cygpath -u "$dll")" "$PKG/"; done
          cp platform/windows/README.txt "$PKG/"
          cp platform/windows/ReClaw-mirror.bat "$PKG/"
          (cd dist && zip -q -r reclaw-windows-x86_64.zip reclaw-windows-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-windows-x86_64
          path: dist/reclaw-windows-x86_64.zip

  vita:
    name: PlayStation Vita (.vpk)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Tools and libraries
        run: |
          (apk add --no-cache bash git python3 zip cmake make 2>/dev/null || \
           (apt-get update && apt-get install -y --no-install-recommends bash git python3 zip cmake make)) || true
          vdpm zlib || true
          platform/deps/fetch.sh
      - name: Build
        run: |
          cmake -S platform/vita -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vita -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-vita
          path: build-vita/reclaw.vpk

  n3ds:
    name: Nintendo 3DS (.3dsx)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools and libraries
        run: |
          dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-zlib
          (apt-get update && apt-get install -y --no-install-recommends zip python3 git ca-certificates) || true
          platform/deps/fetch.sh
      - name: Build
        run: |
          cmake -S platform/3ds -B build-3ds -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-3ds -j"$(nproc)"
      - name: Package
        run: |
          scripts/make_reclaw_tree.sh dist/3ds/reclaw
          cp build-3ds/reclaw.3dsx dist/3ds/reclaw/
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-3ds
          path: dist/

  wiiu:
    name: Wii U (.wuhb)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools and libraries
        run: |
          # (pkg.devkitpro.org sometimes answers 403: the image already has the
          # libraries most of the time, else three tries)
          if [ ! -d "$DEVKITPRO/wut" ] || [ ! -f "$DEVKITPRO/portlibs/ppc/lib/libz.a" ]; then
            for i in 1 2 3; do dkp-pacman -Sy --noconfirm --needed wiiu-dev ppc-zlib && break; sleep 30; done
          fi
          ls -d "$DEVKITPRO/wut" "$DEVKITPRO/portlibs/ppc/lib/libz.a"
          (apt-get update && apt-get install -y --no-install-recommends zip python3 git ca-certificates) || true
          platform/deps/fetch.sh wiiu
      - name: Build
        run: |
          cmake -S platform/wiiu -B build-wiiu -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wiiu -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p dist/wiiu/apps
          cp build-wiiu/reclaw.wuhb dist/wiiu/apps/
          scripts/make_reclaw_tree.sh dist/wiiu/apps/reclaw
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-wiiu
          path: dist/

  ps3:
    name: PlayStation 3 (.pkg)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    env:
      PS3DEV: /opt/ps3dev
      PSL1GHT: /opt/ps3dev
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake bison flex \
            libelf-dev libgmp3-dev libncurses-dev libssl-dev libtool libtool-bin pkg-config \
            python-is-python3 python3-dev texinfo zlib1g-dev zip wget
      - name: Resolve toolchain release
        id: toolchain
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/ps3dev/ps3toolchain/releases | \
            jq -r '[.[] | select(.assets[]?.name == "ps3dev-linux-X64.tar.gz")][0].assets[] | select(.name == "ps3dev-linux-X64.tar.gz") | .browser_download_url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/ps3dev
          key: ps3dev-${{ steps.toolchain.outputs.url }}-sdl2-v2
      - name: Toolchain, PSL1GHT and libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ps3dev.tar.gz "${{ steps.toolchain.outputs.url }}"
          sudo mkdir -p /opt/ps3dev && sudo chown "$USER" /opt/ps3dev
          mkdir -p /tmp/ps3x && tar xzf /tmp/ps3dev.tar.gz -C /tmp/ps3x
          SRC=/tmp/ps3x; [ "$(ls -1 $SRC | wc -l)" = 1 ] && SRC="$SRC/$(ls -1 $SRC)"
          cp -a "$SRC/." /opt/ps3dev/
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          # PSL1GHT and the libraries (zlib, libpng, freetype, SDL2, SDL2_mixer)
          if [ ! -f "$PS3DEV/ppu/include/ppu-lv2.h" ]; then
            git clone --depth 1 https://github.com/ps3dev/ps3toolchain /tmp/ps3toolchain
            (cd /tmp/ps3toolchain && ./toolchain.sh 8)
          fi
          git clone --depth 1 https://github.com/ps3dev/ps3libraries /tmp/ps3libraries
          # SDL2_mixer without libmikmod (not built here; ReClaw plays WAV and MIDI)
          sed -i 's/--enable-music-mod-mikmod/--disable-music-mod-mikmod/' /tmp/ps3libraries/scripts/016-SDL2_mixer-2.0.4.sh
          # 1 zlib, 2 libpng, 4 freetype, 14 SDL2 (PSL1GHT port), 16 SDL2_mixer
          (cd /tmp/ps3libraries && ./libraries.sh 1 2 4 14 16)
          bash "$GITHUB_WORKSPACE/platform/ps3/build-sdl-addons.sh" /tmp/ps3-sdl-addons
      - name: Build
        run: |
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          cmake -S platform/ps3 -B build-ps3 -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/platform/ps3/ps3.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ps3 -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p dist
          cp build-ps3/reclaw.pkg build-ps3/reclaw.self dist/
          [ -f build-ps3/reclaw_hen.pkg ] && cp build-ps3/reclaw_hen.pkg dist/ || true
          echo "Copy CLAW.REZ from your own copy of Claw (1997) to /dev_hdd0/game/RCLW00001/USRDIR/data/CLAW.REZ" > dist/PUT_CLAW.REZ_HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-ps3
          path: dist/


  ps4:
    name: PS4 (.pkg, OpenOrbis)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PacBrew OpenOrbis toolchain and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pacman-package-manager makepkg libarchive-tools cmake zip
          printf '\n[pacbrew]\nSigLevel = Optional TrustAll\nServer = https://pacman.mydedibox.fr/pacbrew/packages/\n' | sudo tee -a /etc/pacman.conf
          sudo pacman -Sy --noconfirm ps4-openorbis ps4-openorbis-portlibs
      # Optional: libc.prx / libSceFios2.prx for sce_module/ (not in the repository).
      # Base64 of a zip with the two files in the secret PS4_SCE_MODULES.
      - name: System modules
        env:
          PS4_SCE_MODULES: ${{ secrets.PS4_SCE_MODULES }}
        run: |
          if [ -n "$PS4_SCE_MODULES" ]; then
            echo "$PS4_SCE_MODULES" | base64 -d > /tmp/sce.zip
            unzip -o -j /tmp/sce.zip '*.prx' -d platform/ps4/sce_module/
          fi
      - name: Build
        run: |
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          openorbis-cmake -S platform/ps4 -B build-ps4 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ps4 -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p dist
          cp build-ps4/*.pkg dist/
          echo "Copy CLAW.REZ from your own copy of Claw (1997) to /data/reclaw/data/CLAW.REZ" > dist/PUT_CLAW.REZ_HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-ps4
          path: dist/

  android:
    name: Android (.apk)
    if: github.ref != 'refs/heads/claw-ps2'   # (claw-ps2: only the PS2 build, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get install -y --no-install-recommends zip
      - name: Dependencies
        run: platform/android/fetch-deps.sh
      - name: Build
        working-directory: platform/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p dist
          cp platform/android/app/build/outputs/apk/release/app-release.apk dist/ReClaw.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reclaw-android
          path: dist/
